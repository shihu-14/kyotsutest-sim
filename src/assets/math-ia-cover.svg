<svg xmlns="http://www.w3.org/2000/svg" width="360" height="500" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
  <title id="title">共通テスト形式の表紙</title>
  <desc id="desc">漫画映画の試験冊子表紙</desc>
  <rect width="360" height="500" fill="#fffdf8"/>
  <rect x="0" y="0" width="26" height="15" fill="#111"/>
  <rect x="52" y="42" width="256" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="180" y="62" text-anchor="middle" font-family="Hiragino Mincho ProN, serif" font-size="12" font-weight="700">試験開始の指示があるまで，見てはいけません。</text>
  <text x="52" y="130" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="34" font-weight="700" letter-spacing="8">漫画映画</text>
  <text x="292" y="112" font-family="Hiragino Mincho ProN, serif" font-size="15" text-anchor="middle">100点</text>
  <text x="292" y="139" font-family="Hiragino Mincho ProN, serif" font-size="15" text-anchor="middle">40分</text>
  <path d="M262 88h58M262 151h58" stroke="#111" stroke-width="1.8"/>
  <path d="M262 88c-16 18-16 45 0 63M320 88c16 18 16 45 0 63" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="52" y="190" font-family="Hiragino Mincho ProN, serif" font-size="17" font-weight="700" letter-spacing="8">注意事項</text>
  <g font-family="Hiragino Mincho ProN, serif" font-size="13" fill="#111">
    <text x="58" y="226">1. 解答用紙に正しくマークしなさい。</text>
    <text x="58" y="255">2. この問題冊子は全13ページです。</text>
    <text x="58" y="284">3. 問題は第1問から第9問まであります。</text>
    <text x="58" y="313">4. 所定の記号をクリックして解答しなさい。</text>
  </g>
  <rect x="58" y="350" width="244" height="58" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="116" y1="350" x2="116" y2="408" stroke="#111" stroke-width="1.5"/>
  <line x1="58" y1="380" x2="302" y2="380" stroke="#111" stroke-width="1.5"/>
  <text x="87" y="371" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="700">解答番号</text>
  <text x="209" y="371" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, sans-serif" font-size="12" font-weight="700">解答欄</text>
  <text x="87" y="398" text-anchor="middle" font-family="Times New Roman, serif" font-size="16">10</text>
  <g fill="none" stroke="#111" stroke-width="1.2" font-family="Arial, sans-serif" font-size="9">
    <ellipse cx="138" cy="393" rx="6" ry="8"/><text x="138" y="396" text-anchor="middle" fill="#111">1</text>
    <ellipse cx="161" cy="393" rx="6" ry="8" fill="#444"/><text x="161" y="396" text-anchor="middle" fill="#fff">2</text>
    <ellipse cx="184" cy="393" rx="6" ry="8"/><text x="184" y="396" text-anchor="middle" fill="#111">3</text>
    <ellipse cx="207" cy="393" rx="6" ry="8"/><text x="207" y="396" text-anchor="middle" fill="#111">4</text>
    <ellipse cx="230" cy="393" rx="6" ry="8"/><text x="230" y="396" text-anchor="middle" fill="#111">5</text>
    <ellipse cx="253" cy="393" rx="6" ry="8"/><text x="253" y="396" text-anchor="middle" fill="#111">6</text>
  </g>
  <text x="180" y="462" text-anchor="middle" font-family="Hiragino Mincho ProN, serif" font-size="14">共通テスト形式 ウェブ模試</text>
